name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tirgeo
          POSTGRES_PASSWORD: tirgeo
          POSTGRES_DB: tirgeo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tirgeo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tirgeo:tirgeo@localhost:5432/tirgeo_test?schema=public
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
